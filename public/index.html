<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Playlist Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        button { background: #007aff; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input, select { background: #2c2c2e; color: white; border: 1px solid #3a3a3c; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; }
        li { background: #2c2c2e; padding: 10px; margin-bottom: 5px; border-radius: 6px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎵 Playlist Automation Hub</h2>
        
        <!-- Create Playlist -->
        <div class="card">
            <h3>Create a New Playlist Container</h3>
            <input type="text" id="playlistName" placeholder="e.g., Chill Automation Track">
            <button onclick="createPlaylist()">Create Playlist</button>
        </div>

        <!-- Automation Queues -->
        <div class="card">
            <h3>Active Playlists</h3>
            <div id="playlistContainer"></div>
        </div>
        
        <!-- Quick Audio Player Preview -->
        <div class="card">
            <h3>Live Automation Player Test</h3>
            <audio id="mainAudioPlayer" controls style="width: 100%; margin-bottom: 10px;"></audio>
            <div id="status">Status: Idle</div>
        </div>
    </div>

    <script>
        let library = {};

        function createPlaylist() {
            const name = document.getElementById('playlistName').value;
            if(!name) return;
            
            library[name] = [];
            document.getElementById('playlistName').value = '';
            renderPlaylists();
        }

        function renderPlaylists() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            
            for (let name in library) {
                container.innerHTML += `
                    <div style="border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px;">
                        <h4>📂 ${name}</h4>
                        <input type="text" placeholder="MP3 Link / Stream URL" id="url-${name}">
                        <input type="number" placeholder="Number of loops (e.g. 3)" id="loops-${name}" min="1">
                        <button onclick="addTrack('${name}')">Add Rule</button>
                        <ul id="list-${name}">
                            ${library[name].map((t, idx) => `<li>${idx+1}. Play ${t.loops}x before skip</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
        }

        function addTrack(playlistName) {
            const url = document.getElementById(`url-${playlistName}`).value;
            const loops = parseInt(document.getElementById(`loops-${playlistName}`).value) || 1;
            
            if(!url) return;
            library[playlistName].push({ url: url, loops: loops });
            renderPlaylists();
        }
    </script>
</body>
</html>
