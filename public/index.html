<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🎵 Music Player Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1113;
      color: #fff;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 900px; width: 100%; }
    .card {
      background: #14181b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 22px; margin-bottom: 20px; }
    .sub { font-size: 13px; color: #9aa4ad; font-weight: normal; }
    label { display: block; font-size: 13px; color: #9aa4ad; margin-bottom: 4px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    input[type="range"] {
      width: 100%;
      margin: 8px 0 12px 0;
      background: transparent;
      accent-color: #0a84ff;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      background: #0a84ff;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }
    button:hover { opacity: 0.85; }
    button.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: #9aa4ad;
    }
    .panel {
      background: rgba(255,255,255,0.02);
      padding: 16px;
      border-radius: 10px;
      margin: 16px 0;
      min-height: 60px;
    }
    .tracks {
      max-height: 400px;
      overflow-y: auto;
      margin: 12px 0;
      border-radius: 8px;
    }
    .track {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-title { font-weight: 500; }
    .track-id { font-size: 11px; color: #9aa4ad; margin-top: 2px; }
    .copy-btn {
      background: #222;
      border: 1px solid rgba(255,255,255,0.03);
      color: #ddd;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .pager {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .debug {
      background: #0b0b0b;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow: auto;
      margin-top: 10px;
    }
    details summary { cursor: pointer; color: #9aa4ad; font-size: 13px; }
    .status-msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; }
    .ok { background: rgba(46,204,113,0.1); color: #2ecc71; }
    .err { background: rgba(255,107,107,0.1); color: #ff6b6b; }
    .loading { background: rgba(10,132,255,0.1); color: #0a84ff; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top: 2px solid #0a84ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .flex-grow { flex: 1; }
    .mb-8 { margin-bottom: 8px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🎵 Music Controller <span class="sub">for ESP32</span></h1>

    <!-- Playlist input -->
    <label>📺 YouTube Playlist URL</label>
    <input type="text" id="playlistUrl" placeholder="https://www.youtube.com/playlist?list=..." />

    <div class="row">
      <div class="flex-grow">
        <label>📄 Items per page</label>
        <input type="number" id="limit" value="50" min="1" max="500" style="width:100px;" />
      </div>
      <button id="loadBtn">🔄 Load Playlist</button>
      <button id="saveSettingsBtn" class="secondary">💾 Save Settings</button>
    </div>

    <!-- Settings panel -->
    <div style="background: rgba(255,255,255,0.02); border-radius: 10px; padding: 16px; margin: 16px 0;">
      <div class="flex">
        <div style="flex:2; min-width:150px;">
          <label>🔊 Volume</label>
          <input type="range" id="volumeSlider" min="0" max="100" value="50" />
          <span id="volumeDisplay" style="font-size:14px;">50%</span>
        </div>
        <div style="flex:3; min-width:150px;">
          <label>🔗 Bluetooth Device (name or MAC)</label>
          <input type="text" id="btDevice" placeholder="e.g. My Earbuds" style="margin-bottom:0;" />
        </div>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="status-msg"></div>

    <!-- Pagination -->
    <div class="pager">
      <button id="prevPage" class="secondary">◀ Prev</button>
      <input type="number" id="page" value="1" min="1" style="width:70px;" />
      <span style="font-size:13px; color:#9aa4ad;">page</span>
      <button id="nextPage" class="secondary">Next ▶</button>
      <span id="pageInfo" style="font-size:13px; color:#9aa4ad; margin-left:auto;"></span>
    </div>

    <!-- Tracks list -->
    <div class="tracks" id="tracks"></div>

    <!-- Debug details -->
    <details>
      <summary>🛠️ Debug details</summary>
      <div id="debug" class="debug">No debug info yet.</div>
    </details>
  </div>
</div>

<script>
  // ---------- DOM refs ----------
  const $ = id => document.getElementById(id);
  const playlistUrl = $('playlistUrl');
  const limitInput = $('limit');
  const pageInput = $('page');
  const loadBtn = $('loadBtn');
  const saveSettingsBtn = $('saveSettingsBtn');
  const prevPage = $('prevPage');
  const nextPage = $('nextPage');
  const tracksEl = $('tracks');
  const statusEl = $('status');
  const debugEl = $('debug');
  const pageInfo = $('pageInfo');
  const volumeSlider = $('volumeSlider');
  const volumeDisplay = $('volumeDisplay');
  const btDevice = $('btDevice');

  let state = { lastData: null, lastUrl: '' };

  // ---------- Status helpers ----------
  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status-msg ' + type;
  }

  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- Load & render tracks ----------
  async function loadPage() {
    const url = playlistUrl.value.trim();
    if (!url) { setStatus('⚠️ Please paste a playlist URL.', 'err'); return; }
    const limit = Math.max(1, Math.min(500, Number(limitInput.value) || 50));
    const page = Math.max(1, Number(pageInput.value) || 1);
    const start = (page - 1) * limit + 1;

    setStatus(`⏳ Loading page ${page}...`, 'loading');
    tracksEl.innerHTML = '';

    try {
      const encoded = encodeURIComponent(url);
      const resp = await fetch(`/api/load-playlist?playlistUrl=${encoded}&limit=${limit}`);
      const txt = await resp.text();
      let data;
      try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
      debugEl.textContent = `HTTP ${resp.status}\n${JSON.stringify(data, null, 2)}`;
      state.lastData = data;
      state.lastUrl = url;

      if (resp.ok && data && data.success) {
        // Extract tracks from various possible keys
        let tracks = data.tracks || data.playlist?.tracks || data.contents?.tracks || [];
        // If the server returned all tracks, we need to slice based on start
        if (tracks.length > 0 && !data.playlist?.tracks) {
          // we requested limited items, but if server returned more, slice
          if (tracks.length > limit) tracks = tracks.slice(0, limit);
        }

        if (tracks.length === 0) {
          setStatus('ℹ️ No tracks on this page. Try page 1.', 'err');
          pageInfo.textContent = '';
          return;
        }

        setStatus(`✅ Loaded ${tracks.length} tracks (page ${page})`, 'ok');
        pageInfo.textContent = `[${start}..${start + tracks.length - 1}]`;

        tracksEl.innerHTML = tracks.map((t, i) => {
          const idx = start + i;
          const title = escapeHtml(t.title || 'Untitled');
          const mp3 = escapeHtml(t.mp3Url || t.url || 'n/a');
          return `<div class="track">
            <div>
              <div class="track-title">#${idx} ${title}</div>
              <div class="track-id">${mp3}</div>
            </div>
            <button class="copy-btn" onclick="copyToClipboard('${t.mp3Url || ''}')">📋 Copy</button>
          </div>`;
        }).join('');

        // Save the playlist URL in localStorage so it persists
        localStorage.setItem('lastPlaylistUrl', url);
      } else {
        const errMsg = data?.error?.message || `HTTP ${resp.status}`;
        setStatus(`❌ Error: ${errMsg}`, 'err');
        pageInfo.textContent = '';
      }
    } catch (err) {
      setStatus(`⚠️ Network error: ${err.message}`, 'err');
      debugEl.textContent = String(err);
    }
  }

  // ---------- Copy to clipboard ----------
  window.copyToClipboard = function(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('✅ Copied!');
    }).catch(() => {
      prompt('Copy this URL:', text);
    });
  };

  // ---------- Save settings to server ----------
  async function saveSettings() {
    const playlist = playlistUrl.value.trim();
    const volume = Number(volumeSlider.value);
    const device = btDevice.value.trim();

    try {
      const resp = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playlistUrl: playlist, volume, bluetoothDevice: device })
      });
      const data = await resp.json();
      if (data.success) {
        setStatus('✅ Settings saved to server!', 'ok');
        // Also store locally
        localStorage.setItem('lastPlaylistUrl', playlist);
        localStorage.setItem('lastVolume', volume);
        localStorage.setItem('lastBtDevice', device);
      } else {
        setStatus('⚠️ Failed to save settings.', 'err');
      }
    } catch (err) {
      setStatus(`⚠️ Error saving: ${err.message}`, 'err');
    }
  }

  // ---------- Load saved settings from localStorage and server ----------
  async function loadSettings() {
    // From localStorage first
    const savedUrl = localStorage.getItem('lastPlaylistUrl') || '';
    const savedVol = localStorage.getItem('lastVolume');
    const savedBt = localStorage.getItem('lastBtDevice') || '';
    if (savedUrl) playlistUrl.value = savedUrl;
    if (savedVol !== null) {
      volumeSlider.value = savedVol;
      volumeDisplay.textContent = savedVol + '%';
    }
    if (savedBt) btDevice.value = savedBt;

    // Then fetch from server (to get the latest values the ESP32 might have used)
    try {
      const resp = await fetch('/api/settings');
      const data = await resp.json();
      if (data.success) {
        const s = data.settings;
        if (s.playlistUrl) playlistUrl.value = s.playlistUrl;
        if (s.volume !== undefined) { volumeSlider.value = s.volume; volumeDisplay.textContent = s.volume + '%'; }
        if (s.bluetoothDevice) btDevice.value = s.bluetoothDevice;
        // Update localStorage to match server
        localStorage.setItem('lastPlaylistUrl', s.playlistUrl || '');
        localStorage.setItem('lastVolume', s.volume || 50);
        localStorage.setItem('lastBtDevice', s.bluetoothDevice || '');
      }
    } catch (e) {
      console.log('Could not fetch settings from server, using local.');
    }
  }

  // ---------- Volume slider display ----------
  volumeSlider.addEventListener('input', () => {
    volumeDisplay.textContent = volumeSlider.value + '%';
  });

  // ---------- Event listeners ----------
  loadBtn.addEventListener('click', () => { pageInput.value = 1; loadPage(); });
  prevPage.addEventListener('click', () => {
    pageInput.value = Math.max(1, Number(pageInput.value) - 1);
    loadPage();
  });
  nextPage.addEventListener('click', () => {
    pageInput.value = Number(pageInput.value) + 1;
    loadPage();
  });
  saveSettingsBtn.addEventListener('click', saveSettings);

  // ---------- Initialize ----------
  loadSettings();
  // If there's a saved playlist, load it automatically
  if (playlistUrl.value.trim()) {
    loadPage();
  }
</script>
</body>
</html>
