<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Playlist Creator</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
        ul { padding: 0; list-style: none; }
        li { background: #2a2a2a; padding: 10px; margin: 5px 0; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎵 YouTube Playlist Automation</h2>
        <p>Add your tracks below in the exact order you want them to play.</p>
        
        <input type="text" id="ytUrl" placeholder="Paste YouTube Link here...">
        <input type="number" id="loopCount" placeholder="How many loops? (e.g., 3)" min="1">
        <button onclick="addTrack()">Add Track to Order</button>

        <h3>Current Order:</h3>
        <ul id="queueList"></ul>
        
        <button onclick="viewRawData()" style="background: #34c759;">Show Microcontroller View</button>
    </div>

    <script>
        let trackQueue = [];

        function addTrack() {
            const url = document.getElementById('ytUrl').value;
            const loops = parseInt(document.getElementById('loopCount').value) || 1;
            
            if(!url) return alert("Please paste a link first!");
            
            // Push track to the array in order
            trackQueue.push({ url: url, loops: loops });
            
            // Clear inputs
            document.getElementById('ytUrl').value = '';
            document.getElementById('loopCount').value = '';
            
            updateDisplay();
        }

        function updateDisplay() {
            const list = document.getElementById('queueList');
            list.innerHTML = '';
            trackQueue.forEach((track, index) => {
                list.innerHTML += `<li><strong>${index + 1}.</strong> ${track.url} — (Loop ${track.loops}x)</li>`;
            });
        }

        // This opens a view that your microcontroller or iPhone app can easily parse later
        async function viewRawData() {
            const response = await fetch('/api/save-playlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tracks: trackQueue })
            });
            window.location.href = '/api/current-playlist';
        }
    </script>
</body>
</html>
